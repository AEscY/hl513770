name: HongLvdeng
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    PRODUCT_NAME: HongLvdeng
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    INFOPLIST_FILE: HongLvdeng/Info.plist
    # 关掉 Swift 严格并发检查，避免 Xcode 新版默认严格模式报错
    SWIFT_STRICT_CONCURRENCY: "minimal"
    # 关掉主线程检查器警告升级为错误
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    ENABLE_BITCODE: NO
    DEVELOPMENT_ASSET_PATHS: ""
targets:
  HongLvdeng:
    type: application
    platform: iOS
    sources:
      - HongLvdeng
    resources:
      - HongLvdeng/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.honglvdeng
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
