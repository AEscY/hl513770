workflows:
  ios-unsigned-ipa:
    name: 红绿灯 iOS（免签 IPA）
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: 安装 xcodegen
        script: |
          brew install xcodegen || brew upgrade xcodegen || true
          xcodegen --version
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: 生成工程
        script: |
          xcodegen generate
          ls -la
      - name: 编译
        script: |
          # 不加 set -e：xcodebuild 失败时仍要往下走，才能打印错误
          xcodebuild \
            -project HongLvdeng.xcodeproj \
            -scheme HongLvdeng \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            ONLY_ACTIVE_ARCH=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
            SWIFT_STRICT_CONCURRENCY=minimal \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            > xcodebuild.log 2>&1
          echo "xcodebuild 退出码: $?"
          grep "error:" xcodebuild.log > ERRORS.txt || true
          echo "@@@@@@@@@@ error: 行（共 $(wc -l < ERRORS.txt | tr -d ' ') 行）@@@@@@@@@@"
          cat ERRORS.txt
          echo "@@@@@@@@@@ 结束 @@@@@@@@@@"
          if [ ! -s ERRORS.txt ]; then
            echo "（无 error 行，输出末尾 150 行）"
            tail -150 xcodebuild.log
          fi
      - name: 打包 IPA
        script: |
          if [ ! -d "build/Build/Products/Release-iphoneos/HongLvdeng.app" ]; then
            echo "未产出 .app，跳过打包"
            exit 1
          fi
          rm -rf Payload && mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/HongLvdeng.app Payload/
          command -v ldid >/dev/null 2>&1 && ldid -S Payload/HongLvdeng.app/HongLvdeng || true
          zip -qry HongLvdeng.ipa Payload
          ls -lh HongLvdeng.ipa
    artifacts:
      - HongLvdeng.ipa
      - ERRORS.txt
      - xcodebuild.log
      - /tmp/xcodebuild_logs/*.log
