workflows:
  ios-unsigned-ipa:
    name: 红绿灯 iOS（免签 IPA）
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      groups:
        - default
    scripts:
      - name: 安装 xcodegen
        script: |
          brew install xcodegen || brew upgrade xcodegen || true
          xcodegen --version
      - name: 生成工程
        script: xcodegen generate
      - name: 编译并打包
        script: |
          set -e
          xcodebuild \
            -project HongLvdeng.xcodeproj \
            -scheme HongLvdeng \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO
          APP="build/Build/Products/Release-iphoneos/HongLvdeng.app"
          rm -rf Payload && mkdir -p Payload
          cp -r "$APP" Payload/
          command -v ldid >/dev/null 2>&1 && ldid -S Payload/HongLvdeng.app/HongLvdeng || true
          zip -qry HongLvdeng.ipa Payload
    artifacts:
      - HongLvdeng.ipa
