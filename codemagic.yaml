workflows:
  ios-unsigned-ipa:
    name: 红绿灯 iOS（免签 IPA）
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: 安装 xcodegen
        script: |
          brew install xcodegen || brew upgrade xcodegen || true
          xcodegen --version
          xcodebuild -version
      - name: 生成工程
        script: |
          xcodegen generate
          echo "=== 生成的 target / product 名 ==="
          xcodebuild -project HongLvdeng.xcodeproj -list
      - name: 编译
        script: |
          # 关键：必须检查退出码。否则编译失败也会显示"完成"。
          xcodebuild \
            -project HongLvdeng.xcodeproj \
            -scheme HongLvdeng \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            ONLY_ACTIVE_ARCH=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
            SWIFT_STRICT_CONCURRENCY=minimal \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            > xcodebuild.log 2>&1
          CODE=$?
          echo "@@@@@@@@@@ xcodebuild 退出码: $CODE @@@@@@@@@@"
          grep "error:" xcodebuild.log > ERRORS.txt || true
          echo "@@@@@@@@@@ error: 行（共 $(wc -l < ERRORS.txt | tr -d ' ') 行）@@@@@@@@@@"
          cat ERRORS.txt
          echo "@@@@@@@@@@ 结束 @@@@@@@@@@"
          if [ $CODE -ne 0 ]; then
            echo "编译失败，打印日志末尾 200 行："
            tail -200 xcodebuild.log
            exit 1
          fi
      - name: 校验并打包
        script: |
          APP="build/Build/Products/Release-iphoneos/HongLvdeng.app"
          echo "=== .app 是否存在 ==="
          ls -ld "$APP" || exit 1

          echo "=== .app 全部文件（找二进制用）==="
          find "$APP" -maxdepth 2 | head -60

          echo "=== Info.plist 声明的可执行文件名 ==="
          DECLARED=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP/Info.plist" 2>/dev/null)
          echo "声明为: [$DECLARED]"

          # 自动探测真正的 Mach-O 二进制，不硬编码名字
          BIN=""
          if [ -n "$DECLARED" ] && [ -f "$APP/$DECLARED" ]; then
            BIN="$APP/$DECLARED"
            echo "按声明找到: $BIN"
          else
            echo "声明名不匹配，扫描 .app 内的 Mach-O 文件…"
            FOUND=$(find "$APP" -type f -perm -u+x 2>/dev/null | head -5)
            echo "可执行权限文件: $FOUND"
            for f in $FOUND; do
              if file "$f" | grep -q "Mach-O"; then
                BIN="$f"
                break
              fi
            done
            echo "扫描结果: [$BIN]"
          fi

          if [ -z "$BIN" ]; then
            echo "!!! 未找到 Mach-O 二进制，编译未产出可执行文件 !!!"
            echo "=== 编译日志末尾 200 行 ==="
            tail -200 xcodebuild.log
            exit 1
          fi

          echo "=== 二进制确认 ==="
          ls -la "$BIN"
          file "$BIN"

          echo "=== ad-hoc 签名 ==="
          command -v ldid >/dev/null 2>&1 && ldid -S "$BIN" || true
          chmod +x "$BIN"

          echo "=== 打包 ==="
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          ls -la "Payload/HongLvdeng.app/$(basename "$BIN")"
          zip -qry HongLvdeng.ipa Payload
          ls -lh HongLvdeng.ipa
    artifacts:
      - HongLvdeng.ipa
      - ERRORS.txt
      - xcodebuild.log
      - /tmp/xcodebuild_logs/*.log
