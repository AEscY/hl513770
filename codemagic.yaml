workflows:
  ios-unsigned-ipa:
    name: 红绿灯 iOS（免签 IPA）
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: 环境检查
        script: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          swiftc --version 2>&1 | head -3
      - name: 类型检查（swiftc -typecheck，能抓类型错误）
        script: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK: $SDK"
          echo "=== 对源码做完整类型检查（含 SwiftUI 类型解析）==="
          xcrun swiftc -typecheck \
            -target arm64-apple-ios15.0 \
            -sdk "$SDK" \
            -swift-version 5 \
            HongLvdeng/HLCore.swift HongLvdeng/HongLvdengApp.swift 2>&1 | tee SYNTAX.txt
          echo "@@@@@@@@@@ 类型检查退出码: ${PIPESTATUS[0]} @@@@@@@@@@"
          if grep -q "error:" SYNTAX.txt; then
            echo ""
            echo "##################################################"
            echo "####  类型错误如下（请复制给开发者）          ####"
            echo "##################################################"
            grep "error:" SYNTAX.txt
            echo "##################################################"
            echo "####  错误总数: $(grep -c 'error:' SYNTAX.txt)           ####"
            echo "##################################################"
            exit 1
          fi
          echo "✓ 类型检查通过"
      - name: 动态验证：真实编译并运行算法检查
        script: |
          echo "═══════════════════════════════════════"
          echo " 这一步在真实的 macOS 机器上编译并运行算法"
          echo " 不是静态检查，是真正跑一遍看结果对不对"
          echo "═══════════════════════════════════════"
          xcrun swiftc -O \
            HongLvdeng/HLCore.swift verify/main.swift \
            -o hlverify 2>&1 | tee VERIFY_BUILD.txt
          VB=$?
          echo "@@@@@@@@@@ 验证程序编译退出码: $VB @@@@@@@@@@"
          if [ $VB -ne 0 ] || [ ! -f ./hlverify ]; then
            echo "!!! 验证程序编译失败，打印错误 !!!"
            cat VERIFY_BUILD.txt
            exit 1
          fi
          echo "✓ 验证程序编译成功，开始运行"
          echo ""
          ./hlverify 2>&1 | tee VERIFY_RUN.txt
          VR=$?
          echo ""
          echo "@@@@@@@@@@ 算法验证退出码: $VR @@@@@@@@@@"
          if [ $VR -ne 0 ]; then
            echo "!!! 算法验证未通过，停止构建 !!!"
            grep "❌" VERIFY_RUN.txt || true
            exit 1
          fi
          echo "✓ 算法验证全部通过，继续编译 App"
      - name: 安装 xcodegen 并生成工程
        script: |
          brew install xcodegen || brew upgrade xcodegen || true
          xcodegen generate
          echo "=== 工程 target 列表 ==="
          xcodebuild -project HongLvdeng.xcodeproj -list
      - name: 编译
        script: |
          xcodebuild \
            -project HongLvdeng.xcodeproj \
            -scheme HongLvdeng \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            ONLY_ACTIVE_ARCH=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
            SWIFT_STRICT_CONCURRENCY=minimal \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            > xcodebuild.log 2>&1
          CODE=$?
          echo "@@@@@@@@@@ xcodebuild 退出码: $CODE @@@@@@@@@@"
          grep "error:" xcodebuild.log > ERRORS.txt || true
          echo "@@@@@@@@@@ error 行数: $(wc -l < ERRORS.txt | tr -d ' ') @@@@@@@@@@"
          echo "@@@@@@@@@@ error 行数: $(wc -l < ERRORS.txt | tr -d ' ') @@@@@@@@@@"
          if [ $CODE -ne 0 ]; then
            echo ""
            echo "##################################################"
            echo "####  编译错误如下（请复制这一段）            ####"
            echo "##################################################"
            cat ERRORS.txt
            echo "##################################################"
            echo "####  上面就是全部错误，共 $(wc -l < ERRORS.txt | tr -d ' ') 行  ####"
            echo "##################################################"
            exit 1
          fi
          echo "✓ 编译成功"
      - name: 校验并打包
        script: |
          APP="build/Build/Products/Release-iphoneos/HongLvdeng.app"
          ls -ld "$APP" || exit 1
          echo "=== .app 内容 ==="
          find "$APP" -maxdepth 2 | head -60

          DECLARED=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP/Info.plist" 2>/dev/null)
          echo "声明的可执行文件: [$DECLARED]"

          BIN=""
          if [ -n "$DECLARED" ] && [ -f "$APP/$DECLARED" ]; then
            BIN="$APP/$DECLARED"
          else
            FOUND=$(find "$APP" -type f -perm -u+x 2>/dev/null | head -5)
            for f in $FOUND; do
              if file "$f" | grep -q "Mach-O"; then BIN="$f"; break; fi
            done
          fi

          if [ -z "$BIN" ]; then
            echo "!!! 未找到 Mach-O 二进制 !!!"
            tail -200 xcodebuild.log
            exit 1
          fi

          echo "=== 二进制: $BIN ==="
          file "$BIN"
          ls -la "$BIN"

          command -v ldid >/dev/null 2>&1 && ldid -S "$BIN" || true
          chmod +x "$BIN"

          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry HongLvdeng.ipa Payload
          ls -lh HongLvdeng.ipa
          echo "=== IPA 内二进制确认 ==="
          unzip -l HongLvdeng.ipa | grep -E "HongLvdeng$|\.app/HongLvdeng$" || unzip -l HongLvdeng.ipa | tail -20
    artifacts:
      - VERIFY_RUN.txt
      - HongLvdeng.ipa
      - SYNTAX.txt
      - ERRORS.txt
      - xcodebuild.log
      - /tmp/xcodebuild_logs/*.log
